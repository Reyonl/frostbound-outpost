name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v0.1.0-alpha'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build 3D web game bundle
        working-directory: web_game
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Sync web bundle to Flutter assets
        run: |
          rm -rf assets/web/*
          cp -r web_game/dist/* assets/web/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Verify Flutter tests and build APKs
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Prepare release APK artifacts
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-release.apk release-apks/FrostboundOutpost-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/FrostboundOutpost-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/FrostboundOutpost-armeabi-v7a.apk

      - name: Resolve release tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.release_tag || 'v0.1.0-alpha' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Frostbound Outpost ${{ steps.tag_info.outputs.tag }}
          generate_release_notes: true
          files: |
            release-apks/FrostboundOutpost-universal.apk
            release-apks/FrostboundOutpost-arm64-v8a.apk
            release-apks/FrostboundOutpost-armeabi-v7a.apk
