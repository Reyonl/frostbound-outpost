name: CI

on:
  push:
    branches: ["main", "feat/*", "fix/*", "chore/*", "refactor/*", "ui/*"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web_game/package-lock.json

      - name: Build and test 3D web game
        working-directory: web_game
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Sync built web game into Flutter assets
        run: |
          rm -rf assets/web/*
          cp -r web_game/dist/* assets/web/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Flutter pub get, analyze, and test
        run: |
          flutter pub get
          flutter analyze
          flutter test
